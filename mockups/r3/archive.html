<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive · Tejvir S. Mann</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="site.css"></head><body>
<main class="wrap">
<div class="pagehead"><h1>Archive</h1><p>Every log, by year.</p></div>
<section style="margin-top:0" data-section="archive"><div class="seg" style="margin-bottom:22px"><a href="logs.html" class="" style="padding:8px 14px;font-size:13px;display:inline-block;color:var(--mute);background:transparent">Latest</a><a href="archive.html" class="on" style="padding:8px 14px;font-size:13px;display:inline-block;color:var(--bg);background:var(--fg)">Archive</a></div><div class="chips yrnav" id="yn"></div><div class="arch" id="arch"></div></section>
</main>
<script src="data.js"></script><script src="repos.js"></script><script src="logs.js"></script><script src="site.js"></script><script>
chrome('logs')
const ys=[...new Set(LOGS.map(l=>l.date.slice(0,4)))].sort((a,b)=>b-a)
yn.innerHTML=ys.map(y=>`<a class="chip" href="#y${y}">${y} <small>${LOGS.filter(l=>l.date.startsWith(y)).length}</small></a>`).join('')
arch.innerHTML=ys.map(y=>`<div id="y${y}"><h3>${y}</h3><ul>${LOGS.filter(l=>l.date.startsWith(y)).map(l=>`<li><span>${new Date(l.date+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}</span><a href="log.html?slug=${l.slug}">${l.title}</a></li>`).join('')}</ul></div>`).join('')
</script></body></html>
